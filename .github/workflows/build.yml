name: Build RePixIV APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.0.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0.2-bin.zip -P /tmp
          unzip -q /tmp/gradle-8.0.2-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.0.2/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RePixIV-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
